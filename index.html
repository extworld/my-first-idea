<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 첫번째 아이디어</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #0e223d 0%, #071322 60%, #030812 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", "Noto Sans KR", sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* 푸른색 앰비언트 글로우 효과 */
    body::before {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.3) 0%, rgba(56, 189, 248, 0.1) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
    }

    .container {
      position: relative;
      text-align: center;
      padding: 3.5rem 5rem;
      background: rgba(10, 20, 36, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6),
                  0 0 60px rgba(37, 99, 235, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .container:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7),
                  0 0 80px rgba(37, 99, 235, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: clamp(2.8rem, 6.5vw, 4.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #93c5fd 0%, #3b82f6 45%, #1d4ed8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.45));
      margin: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>내 첫번째 아이디어</h1>
  </main>
</body>
</html>
