<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 첫번째 아이디어</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #0e223d 0%, #071322 60%, #030812 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", "Noto Sans KR", sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* 푸른색 앰비언트 글로우 효과 */
    body::before {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.3) 0%, rgba(56, 189, 248, 0.1) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2rem;
      text-align: center;
      padding: 3.5rem 5rem;
      background: rgba(10, 20, 36, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6),
                  0 0 60px rgba(37, 99, 235, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      max-width: 90vw;
    }

    .container:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7),
                  0 0 80px rgba(37, 99, 235, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #93c5fd 0%, #3b82f6 45%, #1d4ed8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.45));
      margin: 0;
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.2s ease;
      min-height: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1.fade-out {
      opacity: 0;
      transform: translateY(-6px) scale(0.98);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.95rem 2.2rem;
      font-size: 1.15rem;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: 1px solid rgba(147, 197, 253, 0.4);
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      outline: none;
    }

    .action-btn:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.55),
                  0 0 25px rgba(59, 130, 246, 0.4);
    }

    .action-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .action-btn svg {
      transition: transform 0.2s ease;
    }

    .action-btn:hover svg {
      transform: translateX(3px);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 id="ideaText">내 첫번째 아이디어</h1>
    <button id="nextBtn" class="action-btn" type="button">
      <span>다음 문장 보기</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </main>

  <script>
    const sentences = [
      '내 첫번째 아이디어',
      '오늘도 해냈어요',
      '조금씩 나아지고 있어요',
      '이대로 계속 가봅시다'
    ];

    let currentIndex = 0;
    const ideaText = document.getElementById('ideaText');
    const nextBtn = document.getElementById('nextBtn');

    nextBtn.addEventListener('click', () => {
      ideaText.classList.add('fade-out');
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % sentences.length;
        ideaText.textContent = sentences[currentIndex];
        ideaText.classList.remove('fade-out');
      }, 200);
    });
  </script>
</body>
</html>
